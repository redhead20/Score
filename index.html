<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Score">
<title>Score | Swipe</title>
<link rel="manifest" href="./manifest.webmanifest?v=10">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=10">
<link rel="icon" type="image/png" href="./apple-touch-icon.png?v=10">
<link rel="stylesheet" href="./style.css?v=10">
</head>
<body>
<button id="closeBtn" class="fixed-close muted" type="button" hidden aria-label="Close PDF and return to library">✕ Close</button>
<button id="toolsToggle" class="tools-toggle" type="button" hidden aria-controls="toolbar" aria-expanded="false" aria-label="Show drawing toolbar">✎ Tools</button>
<footer id="toolbar" hidden>
 <div class="topline"><span id="title"></span><button id="openAnother" class="muted">Open</button></div>
 <div class="controls">
  <button id="zoomOut" class="muted" aria-label="Zoom out">−</button><input id="zoomDial" type="range" min="50" max="500" value="100" step="5" aria-label="Zoom scale"><output id="zoomValue">100%</output><button id="zoomIn" class="muted" aria-label="Zoom in">+</button><button id="fitBtn" class="muted">Fit</button>
  <button id="drawBtn" class="muted" aria-pressed="false">✎ Draw</button><label class="pen-control">Thickness <input id="penSize" type="range" min="1" max="12" value="3" aria-label="Pen thickness"><output id="penSizeValue">3</output></label>
  <div class="swatches" role="group" aria-label="Pen colors">
   <button class="swatch chosen" type="button" data-color="#e53935" style="--ink:#e53935" aria-label="Red" aria-pressed="true"></button>
   <button class="swatch" type="button" data-color="#111111" style="--ink:#111111" aria-label="Black" aria-pressed="false"></button>
   <button class="swatch" type="button" data-color="#1565c0" style="--ink:#1565c0" aria-label="Blue" aria-pressed="false"></button>
   <button class="swatch" type="button" data-color="#2e7d32" style="--ink:#2e7d32" aria-label="Green" aria-pressed="false"></button>
   <button class="swatch" type="button" data-color="#f9a825" style="--ink:#f9a825" aria-label="Yellow" aria-pressed="false"></button>
  </div>
  <button id="undoBtn" class="muted" disabled>Undo</button><button id="redoBtn" class="muted" disabled>Redo</button><button id="clearBtn" class="muted">Clear</button>
 </div>
</footer>
<main id="stage">
 <section id="welcome"><div class="emoji">🎼</div><h1>Score Library</h1><p>Your imported sheet music is saved in this browser. Tap a thumbnail to open it, or save an annotated copy using the Save PDF button on its card.</p><button id="openBtn">+ Import PDF</button><p id="libraryStatus" role="status"></p><div id="libraryGrid" class="library-grid" aria-label="Imported PDFs"></div></section>
 <div id="sheet" hidden><canvas id="pdfCanvas"></canvas><canvas id="inkCanvas"></canvas></div>
</main>
<div id="pageInfo" hidden aria-live="polite"></div>
<input type="file" id="file" accept=".pdf,application/pdf" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script type="module" src="./js/app.js?v=10"></script>
</body>
</html>
